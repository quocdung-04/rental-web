spring.application.name=ancu-rentals
server.port=${PORT:8080}

# SQL Server. Never hard-code credentials: set DB_USERNAME / DB_PASSWORD (and optionally DB_URL) as environment variables.
# DB_PASSWORD has NO default on purpose: the app refuses to start until you set it (nothing secret lives in Git).
# The database itself must exist first (see README step 2); tables and sample data are created automatically.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ancu_rentals;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# Tables come from schema.sql, sample data from data.sql (both are safe to run on every start)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Manager sign-in. Set MANAGER_USERNAME / MANAGER_PASSWORD as environment variables.
# If MANAGER_PASSWORD is empty, a random password is generated and printed in the console at startup.
app.manager.username=${MANAGER_USERNAME:manager}
app.manager.password=${MANAGER_PASSWORD:}

# Include the error message in Spring's fallback error JSON (js/api.js shows it to the user)
server.error.include-message=always
